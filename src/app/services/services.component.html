<section class="servicos">

  <!-- Bloco 1: imagem à esquerda, texto à direita -->
  <div class="bloco bloco-dividido">
    <div class="espaco-imagem">
      <!-- ESPAÇO PARA IMAGEM: troque o div pelo <img> quando tiver a foto -->
      <!-- <img src="assets/sua-imagem.jpg" alt="Descrição da imagem" loading="lazy" /> -->
      <div class="imagem-placeholder" aria-hidden="true"></div>
    </div>

    <div class="espaco-texto">
      <!-- ESPAÇO PARA TEXTO -->
      <span class="eyebrow">Subtítulo</span>
      <h2 class="titulo">Título da seção</h2>
      <p class="texto">Texto de apoio da seção.</p>
    </div>
  </div>

  <div class="gap"></div>

  <!-- Bloco 2: espaço para texto -->
  <div class="bloco">
    <div class="espaco-texto">
      <!-- ESPAÇO PARA TEXTO -->
      <span class="eyebrow">Subtítulo</span>
      <h2 class="titulo">Título da seção</h2>
      <p class="texto">Texto de apoio da seção.</p>
    </div>
  </div>

  <div class="gap"></div>

  <!-- Bloco 3: espaço para texto -->
  <div class="bloco">
    <div class="espaco-texto">
      <!-- ESPAÇO PARA TEXTO -->
      <span class="eyebrow">Subtítulo</span>
      <h2 class="titulo">Título da seção</h2>
      <p class="texto">Texto de apoio da seção.</p>
    </div>
  </div>

  <div class="gap"></div>

  <!-- Carrossel (único conteúdo no final) -->
  <div class="bloco carrossel-bloco">
    <div class="carrossel-cabecalho">
      <span class="eyebrow">Eventos</span>
      <h2 class="titulo">Fotos de eventos</h2>
    </div>

    <div class="carrossel-wrapper">
      <button class="carrossel-btn prev-btn" (click)="scrollCarousel(-1)" aria-label="Anterior">
        &#10094;
      </button>

      <div class="carrossel-container" #carousel (touchstart)="pauseAutoplay()">
        <div class="foto-card" *ngFor="let photo of eventPhotos">
          <img [src]="photo.url" [alt]="photo.title" loading="lazy" decoding="async" />
          <div class="foto-legenda" *ngIf="photo.title">
            <span>{{ photo.title }}</span>
          </div>
        </div>
      </div>

      <button class="carrossel-btn next-btn" (click)="scrollCarousel(1)" aria-label="Próximo">
        &#10095;
      </button>
    </div>
  </div>

</section>

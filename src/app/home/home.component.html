<div class="scroll-container">

  <section id="hero">
    <div class="hero-content">

      <div class="hero-top">
        <h1>Caio Siqueira</h1>
        <p>Aluno de engenharia &bull; Desenvolvedor web</p>
      </div>

      <div class="hero-left">
        <div class="team-card-wrapper">
          <div class="team-card">
            <div class="image-container">
              <!-- srcset/sizes: o navegador baixa só o tamanho que a tela usa.
                   width/height refletem a proporção real (16:9) para reservar
                   o espaço antes da imagem chegar. -->
              <img
                [src]="templateText.heroImage.src"
                [attr.srcset]="templateText.heroImage.srcset"
                [attr.sizes]="templateText.heroImage.sizes"
                [alt]="templateText.heroImage.alt"
                width="1600"
                height="900"
                fetchpriority="high"
                decoding="async" />
            </div>
          </div>
        </div>
      </div>

      <div class="hero-right">
        <div class="hero-header">
          <h2 class="typed-text hero-title">{{ templateText.heroTitle }}</h2>
        </div>

        <div class="hero-buttons">
          <a class="btn-zero" routerLink="/about">
            {{ templateText.btnAboutText }}
          </a>
          <a class="btn-primary" routerLink="/services">
            {{ templateText.btnServicesText }}
          </a>
          <a class="btn-secondary" routerLink="/contact">
            {{ templateText.btnContactText }}
          </a>
        </div>
      </div>
    </div>

    <div class="values-bar">
      <img src="assets/fundo-cafe-1.svg" alt="" class="pattern-overlay img1" aria-hidden="true" />
      <img src="assets/fundo-cafe-2.svg" alt="" class="pattern-overlay img2" aria-hidden="true" />
      <img src="assets/fundo-cafe-3.svg" alt="" class="pattern-overlay img3" aria-hidden="true" />
      <div class="value-item" *ngFor="let feature of templateText.features; let i = index">
        <div class="value-icon-box">
          <img [src]="feature.icon" [alt]="feature.title" class="value-icon" loading="lazy" decoding="async" />
        </div>
        <div class="value-text">
          <h3 [appTypewriter]="feature.title" [delay]="i * 300" [speed]="75"></h3>
          <p [appTypewriter]="feature.description" [delay]="i * 300 + 500" [speed]="25"></p>
        </div>
      </div>
    </div>
  </section>

</div>

<section class="contato">
  <div class="coluna-esquerda">
    <nav class="canais">
      <a class="canal" href="https://www.instagram.com/_caiosiqueira._/" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="2" y="2" width="20" height="20" rx="5"/>
          <circle cx="12" cy="12" r="4"/>
          <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/>
        </svg>
        <span>Instagram</span>
      </a>

      <a *ngIf="dados$ | async as dados" class="canal" [href]="dados.whatsapp.whatsappNumberLink" target="_blank" rel="noopener noreferrer" aria-label="WhatsApp">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
        </svg>
        <span>WhatsApp</span>
      </a>

      <a class="canal" href="mailto:contato@hitech.org.br" aria-label="E-mail">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="2" y="4" width="20" height="16" rx="2"/>
          <path d="M22 6L12 13L2 6"/>
        </svg>
        <span>E-mail</span>
      </a>
    </nav>

    <img class="imagem-contato" src="assets/imagem-contato.png" alt="Get in touch" />
  </div>

  <form class="formulario" [formGroup]="form" (ngSubmit)="publishTask()">
    <input id="nome" type="text" placeholder="Nome*" formControlName="name" />
    <input id="email" type="email" placeholder="E-mail*" formControlName="email" />
    <textarea id="mensagem" placeholder="Mensagem" formControlName="description"></textarea>

    <button type="submit" class="enviar" [disabled]="form.invalid || isLoading">
      {{ isLoading ? 'Enviando...' : 'Enviar mensagem' }}
    </button>
  </form>
</section>

<article id="about">

  <section class="about-block about-intro">
  <div class="intro-head">
    <div>
      <p class="subtitle">Trajetória</p>
      <p class="intro-text">teste maroto</p>
    </div>
    <img class="intro-img" src="" alt="" loading="lazy" decoding="async" />
  </div>
</section>

  <section class="about-block about-craft">
    <div class="deco-col" aria-hidden="true"></div>
    <div class="craft-body">
      <p class="subtitle">MEU OFÍCIO</p>
      <p class="description">
        Escreva aqui a descrição do seu ofício, com as áreas em que atua
        e o que faz no dia a dia.
      </p>
    </div>
    <div class="deco-col deco-col--right" aria-hidden="true"></div>
  </section>

  <section class="about-block about-hobbies">
    <p class="subtitle">FORA DO CÓDIGO</p>
    <p class="description">
      Escreva aqui sobre o que você faz fora da faculdade e do trabalho.
    </p>
    <div class="hobby-photos">
      <img src="assets/hobby-1.jpg" alt="Hobby 1" loading="lazy" decoding="async" />
      <img src="assets/hobby-2.jpg" alt="Hobby 2" loading="lazy" decoding="async" />
      <img src="assets/hobby-3.jpg" alt="Hobby 3" loading="lazy" decoding="async" />
      <img src="assets/hobby-4.jpg" alt="Hobby 4" loading="lazy" decoding="async" />
    </div>
  </section>

  <section class="events-section">
    <div class="events-header">
      <span class="events-subtitle">EVENTOS</span>
      <h2 class="events-title">FOTOS DE EVENTOS</h2>
    </div>

    <div class="carousel-wrapper">
      <button class="carousel-btn prev-btn" (click)="scrollCarousel(-1)" aria-label="Anterior">
        &#10094;
      </button>

      <div class="carousel-container" #carousel (touchstart)="pauseAutoplay()">
        <div class="event-card" *ngFor="let photo of eventPhotos">
          <img [src]="photo.url" [alt]="photo.title" loading="lazy" decoding="async" />
          <div class="event-card-caption" *ngIf="photo.title">
            <span>{{ photo.title }}</span>
          </div>
        </div>
      </div>

      <button class="carousel-btn next-btn" (click)="scrollCarousel(1)" aria-label="Próximo">
        &#10095;
      </button>
    </div>
  </section>

</article>

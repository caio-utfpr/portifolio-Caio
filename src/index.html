<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Caio Siqueira | Aluno | Desenvolvedor</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- SEO básico -->
    <meta
      name="description"
      content="Desenvolvo sites, sistemas web, automações e design de produto."
    />
    <meta name="author" content="Caio" />
    <meta name="robots" content="index, follow" />
    <!--TODO-->
    <link rel="canonical" href="https://hitech.org.br/" />

    <!-- Open Graph (WhatsApp, LinkedIn, Facebook) -->
    <meta property="og:type" content="profile" />
    <meta property="og:site_name" content="Caio Siqueira" />
    <meta property="og:title" content="Desenvolvo sites, sistemas web, automações e design de produto." />
    <meta
      property="og:description"
      content=".Desenvolvo sites, sistemas web, automações e design de produto."
    />
    <!--TODO-->
    <meta property="og:url" content="https://hitech.org.br/" />
    <!-- Imagem da prévia ao compartilhar o link (WhatsApp, LinkedIn etc).
         O ideal é uma arte em 1200x630; a logo atual é 229x316 e sai como
         miniatura pequena. Ao trocar, declarar também og:image:width/height
         e usar twitter:card="summary_large_image". -->
    <meta property="og:image" content="https://hitech.org.br/assets/logo-cafe.png" />
    <meta property="og:locale" content="pt_BR" />

    <link rel="icon" type="image/png" href="assets/logo-cafe.png" />
    <link rel="shortcut icon" href="assets/logo-cafe.png" />

    <!-- Preload das fontes principais para reduzir o tempo de renderização do texto -->
    <link
      rel="preload"
      href="assets/fonts/poppins-regular-webfont.woff2"
      as="font"
      type="font/woff2"
      crossorigin="anonymous"
    />
    <link
      rel="preload"
      href="assets/fonts/poppins-bold-webfont.woff2"
      as="font"
      type="font/woff2"
      crossorigin="anonymous"
    />

    <!-- Dados estruturados (Schema.org) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Hï Tech",
        "url": "https://hitech.org.br/",
        "logo": "https://hitech.org.br/assets/logo-cafe.png",
        "description": "Empresa júnior de tecnologia que cria sites, sistemas web, automações e design de produto.",
        "email": "contato@hitech.org.br",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Curitiba",
          "addressRegion": "PR",
          "addressCountry": "BR"
        }
      }
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
